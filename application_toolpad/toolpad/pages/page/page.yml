# yaml-language-server: $schema=https://raw.githubusercontent.com/mui/toolpad/v0.13.0/docs/schemas/v1/definitions.json#properties/Page

apiVersion: v1
kind: page
spec:
  title: Default page
  alias:
    - WuDrmg6
  content:
    - component: Text
      name: text
      layout:
        horizontalAlign: center
      props:
        variant: h2
        value: Projet final - Service Web
    - component: PageRow
      name: pageRow
      props:
        justifyContent: start
      children:
        - component: PageColumn
          name: pageColumn
          layout:
            columnSize: 1.0373831775700935
          children:
            - component: DataGrid
              name: dataGrid
              layout:
                columnSize: 1
              props:
                rows:
                  $$jsExpression: QueryListeLivre.data.livres
                columns:
                  - field: id
                    type: number
                  - field: bibliotheque_id
                    type: number
                  - field: titre
                    type: string
                  - field: auteur
                    type: string
                  - field: description
                    type: json
                  - field: isbn
                    type: number
                  - field: date_ajout
                    type: dateTime
                  - field: disponible
                    type: boolean
            - component: Checkbox
              name: checkbox
              props:
                mode: checkbox
                label: Afficher tous les livres
        - component: DataGrid
          name: dataGrid1
          layout:
            columnSize: 0.9626168224299065
          props:
            rows:
              $$jsExpression: QueryListePret.data.prets
            columns:
              - field: livre_id
                type: number
              - field: emprunteur
                type: string
              - field: date_retour
                type: dateTime
              - field: disponible
                type: boolean
    - component: PageRow
      name: pageRow1
      children:
        - component: Text
          name: text1
          layout:
            columnSize: 0.99822695035461
          props:
            value: Modifier disponibilité prêt
            variant: h5
        - component: Form
          name: form
          children:
            - component: TextField
              name: textField
              props:
                label: id
                defaultValue: "3"
            - component: TextField
              name: textField3
              props:
                label: boolean
          layout:
            columnSize: 1.00177304964539
          props:
            formControlsAlign: start
            submitButtonText: "Modifier"
            onSubmit:
              $$jsExpressionAction: ModifierDisPret.call()
        - component: Text
          name: text2
          props:
            value: Modifier disponibilité livre
            variant: h5
        - component: Form
          name: form1
          children:
            - component: TextField
              name: textField1
              props:
                label: id
            - component: TextField
              name: textField2
              props:
                label: boolean
          props:
            formControlsAlign: start
            onSubmit:
              $$jsExpressionAction: ModifierDisLivre.call()
      props:
        justifyContent: start
    - component: Form
      name: form2
      props:
        onSubmit:
          $$jsExpressionAction: AjouterUnLivre.call()
        submitButtonText: Ajouter
      children:
        - component: Text
          name: text3
          props:
            value: Ajouter un livre
            variant: h4
        - component: TextField
          name: textFieldBibliothequeId
          props:
            label: bibliotheque_id
        - component: PageRow
          name: pageRow2
          props:
            justifyContent: start
          children:
            - component: TextField
              name: textFieldTitre
              props:
                label: titre
            - component: TextField
              name: textFieldIsbn
              props:
                label: isbn
        - component: PageRow
          name: pageRow3
          props:
            justifyContent: start
          children:
            - component: TextField
              name: textFieldAuteur
              props:
                label: auteur
            - component: TextField
              name: textFieldDateAjout
              props:
                label: date_ajout
        - component: PageRow
          name: pageRow4
          props:
            justifyContent: start
          children:
            - component: TextField
              name: textFieldDescription
              layout:
                columnSize: 1
              props:
                label: description
            - component: TextField
              name: textFieldDisponible
              props:
                label: disponible
        - component: Spacer
          name: spacer
          layout:
            height: 60
    - component: Form
      name: form3
      props:
        onSubmit:
          $$jsExpressionAction: ModifierUnLivre.call()
        submitButtonText: Modifier
      children:
        - component: Text
          name: text5
          props:
            value: Modifier un livre
            variant: h4
        - component: PageRow
          name: pageRow7
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldLivreId
              props:
                label: livre_id
                defaultValue: "1"
            - component: TextField
              name: ModtextFieldBibliothequeId1
              props:
                label: bibliotheque_id
        - component: PageRow
          name: pageRow5
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldTitre1
              props:
                label: titre
            - component: TextField
              name: ModtextFieldIsbn1
              props:
                label: isbn
        - component: PageRow
          name: pageRow5
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldAuteur1
              props:
                label: auteur
            - component: TextField
              name: ModtextFieldDateAjout1
              props:
                label: date_ajout
        - component: PageRow
          name: pageRow5
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldDescription1
              props:
                label: description
              layout:
                columnSize: 1
            - component: TextField
              name: ModtextFieldDisponible1
              props:
                label: disponible
        - component: Spacer
          name: spacer1
          layout:
            height: 60
    - component: Form
      name: form4
      props:
        onSubmit:
          $$jsExpressionAction: ModifierUnLivre.call()
        submitButtonText: Modifier
      children:
        - component: Text
          name: text4
          props:
            value: Modifier un livre
            variant: h4
        - component: PageRow
          name: pageRow6
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldLivreId1
              props:
                defaultValue: "1"
                label: livre_id
            - component: TextField
              name: ModtextFieldBibliothequeId2
              props:
                label: bibliotheque_id
        - component: PageRow
          name: pageRow6
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldTitre2
              props:
                label: titre
            - component: TextField
              name: ModtextFieldIsbn2
              props:
                label: isbn
        - component: PageRow
          name: pageRow6
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldAuteur2
              props:
                label: auteur
            - component: TextField
              name: ModtextFieldDateAjout2
              props:
                label: date_ajout
        - component: PageRow
          name: pageRow6
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldDescription2
              layout:
                columnSize: 1
              props:
                label: description
            - component: TextField
              name: ModtextFieldDisponible2
              props:
                label: disponible
        - component: Spacer
          name: spacer2
          layout:
            height: 60
  queries:
    - name: QueryListeLivre
      mode: query
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/liste?tous=${paramete\
            rs.tous}`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: GET
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: tous
          value:
            $$jsExpression: checkbox.checked ?? false
    - name: QueryListePret
      mode: query
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/livre/${parameters.id\
            _livre}`"
        headers:
          - name: Authorization
            value:
              $$jsExpression: parameters.cle_api
        method: GET
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: id_livre
          value:
            $$jsExpression: dataGrid.selection?.id
    - name: ModifierDisLivre
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/modifier_status_livre\
            /${parameters.id_livre}`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: PUT
        body:
          kind: raw
          content:
            $$jsExpression: "`{\r

              \  \"disponible\": ${parameters.mod_dis_livre}\r

              }`"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: mod_dis_livre
          value:
            $$jsExpression: textField2.value
        - name: id_livre
          value:
            $$jsExpression: textField1.value
    - name: ModifierDisPret
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/modifier_status_pret/\
            ${parameters.id_pret}`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: PUT
        body:
          kind: raw
          content:
            $$jsExpression: "`{\r

              \  \"disponible\": ${parameters.mod_dis_pret}\r

              }`"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: id_pret
          value:
            $$jsExpression: textField.value
        - name: mod_dis_pret
          value:
            $$jsExpression: textField3.value
    - name: AjouterUnLivre
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression: "`${parameters.hostname}/api/bibliotheque/`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: POST
        body:
          kind: raw
          content:
            $$jsExpression: "`\r

              {\r

              \  \"bibliotheque_id\": ${parameters.bibliotheque_id},\r

              \  \"titre\": \"${parameters.titre}\",\r

              \  \"auteur\": \"${parameters.auteur}\",\r

              \  \"description\": \"${parameters.description}\",\r

              \  \"isbn\": \"${parameters.isbn}\",\r

              \  \"date_ajout\": \"${parameters.date_ajout}\",\r

              \  \"disponible\": ${parameters.disponible}\r

              }`"
          contentType: application/json
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: bibliotheque_id
          value:
            $$jsExpression: textFieldBibliothequeId.value
        - name: titre
          value:
            $$jsExpression: textFieldTitre.value
        - name: auteur
          value:
            $$jsExpression: textFieldAuteur.value
        - name: description
          value:
            $$jsExpression: textFieldDescription.value
        - name: isbn
          value:
            $$jsExpression: textFieldIsbn.value
        - name: date_ajout
          value:
            $$jsExpression: textFieldDateAjout.value
        - name: disponible
          value:
            $$jsExpression: textFieldDisponible.value
    - name: ModifierUnLivre
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/modifier_livre/${para\
            meters.livre_id}`"
        headers:
          - name: Authorization
            value:
              $$jsExpression: parameters.cle_api
        method: PUT
        body:
          kind: raw
          content:
            $$jsExpression: "`\r

              {\r

              \  \"bibliotheque_id\": ${parameters.bibliotheque_id},\r

              \  \"titre\": \"${parameters.titre}\",\r

              \  \"auteur\": \"${parameters.auteur}\",\r

              \  \"description\": \"${parameters.description}\",\r

              \  \"isbn\": \"${parameters.isbn}\",\r

              \  \"date_ajout\": \"${parameters.date_ajout}\",\r

              \  \"disponible\": ${parameters.disponible}\r

              }`"
          contentType: application/json
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: bibliotheque_id
          value:
            $$jsExpression: ModtextFieldBibliothequeId1.value
        - name: titre
          value:
            $$jsExpression: ModtextFieldTitre1.value
        - name: auteur
          value:
            $$jsExpression: ModtextFieldAuteur1.value
        - name: description
          value:
            $$jsExpression: ModtextFieldDescription1.value
        - name: isbn
          value:
            $$jsExpression: ModtextFieldIsbn1.value
        - name: date_ajout
          value:
            $$jsExpression: ModtextFieldDateAjout1.value
        - name: disponible
          value:
            $$jsExpression: ModtextFieldDisponible1.value
        - name: livre_id
          value:
            $$jsExpression: ModtextFieldLivreId.value
