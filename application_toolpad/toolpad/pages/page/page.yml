# yaml-language-server: $schema=https://raw.githubusercontent.com/mui/toolpad/v0.13.0/docs/schemas/v1/definitions.json#properties/Page

apiVersion: v1
kind: page
spec:
  title: Default page
  alias:
    - WuDrmg6
  content:
    - component: Text
      name: text
      layout:
        horizontalAlign: center
      props:
        variant: h2
        value: Projet final - Service Web
    - component: PageRow
      name: pageRow
      props:
        justifyContent: start
      children:
        - component: PageColumn
          name: pageColumn
          layout:
            columnSize: 1.0373831775700935
          children:
            - component: DataGrid
              name: dataGrid
              layout:
                columnSize: 1
              props:
                rows:
                  $$jsExpression: QueryListeLivre.data.livres
                columns:
                  - field: id
                    type: number
                  - field: bibliotheque_id
                    type: number
                  - field: titre
                    type: string
                  - field: auteur
                    type: string
                  - field: description
                    type: json
                  - field: isbn
                    type: number
                  - field: date_ajout
                    type: dateTime
                  - field: disponible
                    type: boolean
            - component: Checkbox
              name: checkbox
              props:
                mode: checkbox
                label: Afficher tous les livres
        - component: DataGrid
          name: dataGrid1
          layout:
            columnSize: 0.9626168224299065
          props:
            rows:
              $$jsExpression: QueryListePret.data.prets
            columns:
              - field: livre_id
                type: number
              - field: emprunteur
                type: string
              - field: date_retour
                type: dateTime
              - field: disponible
                type: boolean
    - component: PageRow
      name: pageRow1
      children:
        - component: Text
          name: text1
          layout:
            columnSize: 0.99822695035461
          props:
            value: Modifier disponibilité prêt
            variant: h5
        - component: Form
          name: form
          children:
            - component: TextField
              name: textField
              props:
                label: id
                defaultValue:
                  $$jsExpression: dataGrid1.selection?.id
            - component: TextField
              name: textField3
              props:
                label: boolean
                defaultValue:
                  $$jsExpression: dataGrid1.selection?.disponible
          layout:
            columnSize: 1.00177304964539
          props:
            formControlsAlign: start
            submitButtonText: "Modifier"
            onSubmit:
              $$jsExpressionAction: ModifierDisPret.call()
        - component: Text
          name: text2
          props:
            value: Modifier disponibilité livre
            variant: h5
        - component: Form
          name: form1
          props:
            formControlsAlign: start
            onSubmit:
              $$jsExpressionAction: ModifierDisLivre.call()
            submitButtonText: Modifier
          children:
            - component: TextField
              name: textField1
              props:
                label: id
                defaultValue:
                  $$jsExpression: dataGrid.selection?.id
            - component: TextField
              name: textField2
              props:
                label: boolean
                defaultValue:
                  $$jsExpression: dataGrid.selection?.disponible
      props:
        justifyContent: start
    - component: Form
      name: form5
      props:
        onSubmit:
          $$jsExpressionAction: AjouterUnLivre.call()
        submitButtonText: Ajouter
      children:
        - component: Text
          name: text6
          props:
            value: Ajouter un livre
            variant: h4
        - component: TextField
          name: textFieldBibliothequeId1
          props:
            label: bibliotheque_id
            defaultValue:
              $$jsExpression: dataGrid.selection?.bibliotheque_id
        - component: PageRow
          name: pageRow6
          props:
            justifyContent: start
          children:
            - component: TextField
              name: textFieldTitre1
              props:
                label: titre
                defaultValue:
                  $$jsExpression: dataGrid.selection?.titre
            - component: TextField
              name: textFieldIsbn1
              props:
                label: isbn
        - component: PageRow
          name: pageRow2
          props:
            justifyContent: start
          children:
            - component: TextField
              name: textFieldAuteur1
              props:
                label: auteur
                defaultValue:
                  $$jsExpression: dataGrid.selection?.auteur
            - component: TextField
              name: textFieldDateAjout1
              props:
                label: date_ajout
        - component: PageRow
          name: pageRow3
          props:
            justifyContent: start
          children:
            - component: TextField
              name: textFieldDescription1
              layout:
                columnSize: 1
              props:
                label: description
                defaultValue:
                  $$jsExpression: dataGrid.selection?.description
            - component: TextField
              name: textFieldDisponible1
              props:
                label: disponible
        - component: Spacer
          name: spacer2
          layout:
            height: 60
    - component: Form
      name: form3
      props:
        onSubmit:
          $$jsExpressionAction: ModifierUnLivre.call()
        submitButtonText: Modifier
      children:
        - component: Text
          name: text5
          props:
            value: Modifier un livre
            variant: h4
        - component: PageRow
          name: pageRow7
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldLivreId
              props:
                label: livre_id
                defaultValue:
                  $$jsExpression: dataGrid.selection?.id
            - component: TextField
              name: ModtextFieldBibliothequeId1
              props:
                label: bibliotheque_id
        - component: PageRow
          name: pageRow5
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldTitre1
              props:
                label: titre
            - component: TextField
              name: ModtextFieldIsbn1
              props:
                label: isbn
        - component: PageRow
          name: pageRow4
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldAuteur1
              props:
                label: auteur
            - component: TextField
              name: ModtextFieldDateAjout1
              props:
                label: date_ajout
        - component: PageRow
          name: pageRow8
          props:
            justifyContent: start
          children:
            - component: TextField
              name: ModtextFieldDescription1
              layout:
                columnSize: 1
              props:
                label: description
            - component: TextField
              name: ModtextFieldDisponible1
              props:
                label: disponible
        - component: Spacer
          name: spacer1
          layout:
            height: 60
    - component: Text
      name: text4
      props:
        value: Supprimer un livre
        variant: h5
    - component: Form
      name: form7
      props:
        formControlsAlign: start
        submitButtonText: Supprimer
        onSubmit:
          $$jsExpressionAction: ModifierDisPret.call()
      layout:
        columnSize: 1.00177304964539
      children:
        - component: TextField
          name: suppIdLivre1
          props:
            label: livre_id
            defaultValue: "3"
    - component: Spacer
      name: spacer5
    - component: PageRow
      name: pageRow9
      props:
        justifyContent: start
      children:
        - component: Form
          name: form6
          children:
            - component: Text
              name: text7
              props:
                value: Modifier un prêt
                variant: h4
            - component: TextField
              name: modifierPretId
              props:
                label: pret_id
                defaultValue: "1"
            - component: TextField
              name: modifierPretLivreid1
              props:
                label: livre_id
            - component: TextField
              name: modifierPretEmprunteur1
              props:
                label: emprunteur
            - component: TextField
              name: modifierPretDispo1
              layout:
                columnSize: 1
              props:
                label: disponible
            - component: PageRow
              name: pageRow10
              props:
                justifyContent: start
              children:
                - component: TextField
                  name: modifierPretDateRetour1
                  props:
                    label: date_retour
                - component: Spacer
                  name: spacer4
                  layout:
                    height: 60
          layout:
            columnSize: 1
          props:
            onSubmit:
              $$jsExpressionAction: ModifierUnPret.call()
            submitButtonText: Modifier
            formControlsAlign: start
        - component: Spacer
          name: spacer3
          layout:
            columnSize: 1
        - component: Form
          name: form2
          props:
            onSubmit:
              $$jsExpressionAction: AjouterUnPret.call()
            submitButtonText: Ajouter
            formControlsAlign: end
          children:
            - component: Text
              name: text3
              props:
                value: Ajouter un prêt
                variant: h4
            - component: TextField
              name: ajoutPretLivreid
              props:
                label: livre_id
                defaultValue: "1"
            - component: TextField
              name: ajoutPretEmprunteur
              props:
                label: emprunteur
                defaultValue: moi
            - component: TextField
              name: ajoutPretDispo
              layout:
                columnSize: 1
              props:
                label: disponible
                defaultValue: "true"
            - component: PageRow
              name: pageRow11
              props:
                justifyContent: start
              children:
                - component: TextField
                  name: ajoutPretDateRetour
                  props:
                    label: date_retour
                    defaultValue: 2013-03-25T04:00:00.000Z
                - component: Spacer
                  name: spacer
                  layout:
                    height: 60
    - component: Spacer
      name: spacer6
    - component: Form
      name: form4
      layout:
        columnSize: 1.00177304964539
      props:
        formControlsAlign: start
        submitButtonText: Supprimer
        onSubmit:
          $$jsExpressionAction: SuppUnPret.call()
      children:
        - component: Text
          name: text8
          props:
            value: Supprimer un prêt
            variant: h5
        - component: TextField
          name: suppIdPret
          props:
            label: pret_id
            defaultValue: "3"
  queries:
    - name: QueryListeLivre
      mode: query
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/liste?tous=${paramete\
            rs.tous}`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: GET
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: tous
          value:
            $$jsExpression: checkbox.checked ?? false
    - name: QueryListePret
      mode: query
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/livre/${parameters.id\
            _livre}`"
        headers:
          - name: Authorization
            value:
              $$jsExpression: parameters.cle_api
        method: GET
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: id_livre
          value:
            $$jsExpression: dataGrid.selection?.id
    - name: ModifierDisLivre
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/modifier_status_livre\
            /${parameters.id_livre}`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: PUT
        body:
          kind: raw
          content:
            $$jsExpression: "`{\r

              \  \"disponible\": ${parameters.mod_dis_livre}\r

              }`"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: mod_dis_livre
          value:
            $$jsExpression: textField2.value
        - name: id_livre
          value:
            $$jsExpression: textField1.value
    - name: ModifierDisPret
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/modifier_status_pret/\
            ${parameters.id_pret}`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: PUT
        body:
          kind: raw
          content:
            $$jsExpression: "`{\r

              \  \"disponible\": ${parameters.mod_dis_pret}\r

              }`"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: id_pret
          value:
            $$jsExpression: textField.value
        - name: mod_dis_pret
          value:
            $$jsExpression: textField3.value
    - name: AjouterUnLivre
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression: "`${parameters.hostname}/api/bibliotheque/`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: POST
        body:
          kind: raw
          content:
            $$jsExpression: "`\r

              {\r

              \  \"bibliotheque_id\": ${parameters.bibliotheque_id},\r

              \  \"titre\": \"${parameters.titre}\",\r

              \  \"auteur\": \"${parameters.auteur}\",\r

              \  \"description\": \"${parameters.description}\",\r

              \  \"isbn\": \"${parameters.isbn}\",\r

              \  \"date_ajout\": \"${parameters.date_ajout}\",\r

              \  \"disponible\": ${parameters.disponible}\r

              }`"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: bibliotheque_id
          value:
            $$jsExpression: textFieldBibliothequeId.value
        - name: titre
          value:
            $$jsExpression: textFieldTitre.value
        - name: auteur
          value:
            $$jsExpression: textFieldAuteur.value
        - name: description
          value:
            $$jsExpression: textFieldDescription.value
        - name: isbn
          value:
            $$jsExpression: textFieldIsbn.value
        - name: date_ajout
          value:
            $$jsExpression: textFieldDateAjout.value
        - name: disponible
          value:
            $$jsExpression: textFieldDisponible.value
    - name: ModifierUnLivre
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/modifier_livre/${para\
            meters.livre_id}`"
        headers:
          - name: Authorization
            value:
              $$jsExpression: parameters.cle_api
        method: PUT
        body:
          kind: raw
          content:
            $$jsExpression: "`\r

              {\r

              \  \"bibliotheque_id\": ${parameters.bibliotheque_id},\r

              \  \"titre\": \"${parameters.titre}\",\r

              \  \"auteur\": \"${parameters.auteur}\",\r

              \  \"description\": \"${parameters.description}\",\r

              \  \"isbn\": \"${parameters.isbn}\",\r

              \  \"date_ajout\": \"${parameters.date_ajout}\",\r

              \  \"disponible\": ${parameters.disponible}\r

              }`"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: bibliotheque_id
          value:
            $$jsExpression: ModtextFieldBibliothequeId1.value
        - name: titre
          value:
            $$jsExpression: ModtextFieldTitre1.value
        - name: auteur
          value:
            $$jsExpression: ModtextFieldAuteur1.value
        - name: description
          value:
            $$jsExpression: ModtextFieldDescription1.value
        - name: isbn
          value:
            $$jsExpression: ModtextFieldIsbn1.value
        - name: date_ajout
          value:
            $$jsExpression: ModtextFieldDateAjout1.value
        - name: disponible
          value:
            $$jsExpression: ModtextFieldDisponible1.value
        - name: livre_id
          value:
            $$jsExpression: ModtextFieldLivreId.value
    - name: AjouterUnPret
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression: "`${parameters.hostname}/api/bibliotheque/ajout_pret`"
        headers:
          - name: Authorization
            value:
              $$jsExpression: parameters.cle_api
        method: POST
        body:
          kind: raw
          content:
            $$jsExpression: "`\r

              {\r

              \    \"livre_id\": ${parameters.livre_id},\r

              \    \"emprunteur\": \"${parameters.emprunteur}\",\r

              \    \"date_retour\": \"${parameters.date_retour}\",\r

              \    \"disponible\": ${parameters.disponible}\r

              }\r

              `"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: livre_id
          value:
            $$jsExpression: ajoutPretLivreid.value
        - name: emprunteur
          value:
            $$jsExpression: ajoutPretEmprunteur.value
        - name: disponible
          value:
            $$jsExpression: ajoutPretDispo.value
        - name: date_retour
          value:
            $$jsExpression: ajoutPretDateRetour.value
    - name: ModifierUnPret
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/modifier_pret/${param\
            eters.pret_id}`"
        headers:
          [
            {
              name: Authorization,
              value: { $$jsExpression: parameters.cle_api },
            },
          ]
        method: PUT
        body:
          kind: raw
          content:
            $$jsExpression: "`\r

              {\r

              \    \"livre_id\": ${parameters.livre_id},\r

              \    \"emprunteur\": \"${parameters.emprunteur}\",\r

              \    \"date_retour\": \"${parameters.date_retour}\",\r

              \    \"disponible\": ${parameters.disponible}\r

              }\r

              `"
          contentType: application/json
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: pret_id
          value:
            $$jsExpression: modifierPretId.value
        - name: livre_id
          value:
            $$jsExpression: modifierPretLivreid1.value
        - name: emprunteur
          value:
            $$jsExpression: modifierPretEmprunteur1.value
        - name: disponible
          value:
            $$jsExpression: modifierPretDispo1.value
        - name: date_retour
          value:
            $$jsExpression: modifierPretDateRetour1.value
    - name: SuppUnPret
      mode: mutation
      query:
        kind: rest
        url:
          $$jsExpression:
            "`${parameters.hostname}/api/bibliotheque/supp_pret/${parameter\
            s.pret_id}`"
        headers:
          - name: Authorization
            value:
              $$jsExpression: parameters.cle_api
        method: DELETE
        searchParams: []
      parameters:
        - name: hostname
          value:
            $$env: hostname
        - name: cle_api
          value:
            $$env: cle_api
        - name: pret_id
          value:
            $$jsExpression: suppIdPret.value
